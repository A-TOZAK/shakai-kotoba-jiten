<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="小学校3〜6年生の社会科の言葉389語を、やさしい意味・例文・図解で調べられる用語辞典。すべての言葉に図解つき。">
    <title>社会ことば辞典 第3版 | School Stock</title>
    <link rel="stylesheet" href="assets/styles.css?v=3">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="brand-line"><span class="brand">School Stock</span><span class="edition" data-edition-label>第3版</span></p>
        <h1>社会<span class="accent">ことば</span>辞典</h1>
        <p class="lead">社会科のことばを、図で調べる辞典。<strong>3〜6年生の389語、ぜんぶに図解つき。</strong></p>
      </div>
    </header>

    <div class="search-band">
      <div class="search-inner">
        <label class="search-box">
          <span class="visually-hidden">調べたい言葉</span>
          <input id="searchInput" type="search" placeholder="例: 方位、消防署、国会" autocomplete="off">
        </label>
        <div class="grade-chips" role="group" aria-label="学年でしぼりこむ">
          <button class="chip active" data-filter-kind="grade" data-filter-value="all">すべて</button>
          <button class="chip" data-filter-kind="grade" data-filter-value="3">3年</button>
          <button class="chip" data-filter-kind="grade" data-filter-value="4">4年</button>
          <button class="chip" data-filter-kind="grade" data-filter-value="5">5年</button>
          <button class="chip" data-filter-kind="grade" data-filter-value="6">6年</button>
        </div>
      </div>
    </div>

    <main class="tool-layout">
      <aside class="filters-panel" aria-label="しぼりこみ">
        <details class="panel-block" id="kanaBlock" open>
          <summary>あいうえお順</summary>
          <div class="kana-grid" id="kanaFilter"></div>
        </details>
        <details class="panel-block" id="unitBlock">
          <summary>単元でさがす</summary>
          <div class="tag-list" id="unitFilter"></div>
        </details>
        <details class="panel-block" id="thinkingBlock">
          <summary>見方・考え方</summary>
          <div class="tag-list" id="thinkingFilter"></div>
        </details>
      </aside>

      <section class="results-area" aria-label="用語一覧">
        <div class="results-head">
          <p class="count"><span id="resultCount">0</span><small>語</small></p>
          <button class="reset-button" id="resetFilters" type="button">しぼりこみをリセット</button>
        </div>
        <div class="term-grid" id="termGrid"></div>
        <button class="show-more" id="showMore" type="button" hidden>つづきを見る</button>
        <p class="empty-state" id="emptyState" hidden>見つかりませんでした。別の言葉で検索してみてください。</p>
      </section>
    </main>

    <section class="teacher-band">
      <div class="teacher-inner">
        <h2>先生・おうちの方へ</h2>
        <div>
          <p>意味・例文・図解はすべて自作です。学習指導要領・教科書・年間指導計画を参考に、授業で確認しながら育てている教材データです。</p>
          <div class="form-links">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfN4o0kxUThyZajWw6gqnSNQ6STu92WrQHEuZJv_ZbGqxKOgA/viewform" target="_blank" rel="noopener">追加してほしい言葉を送る</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfEdOGc-b0GSouR7Gab7YsTsbL2SntOROlpdBVskjJ4SmtN6A/viewform" target="_blank" rel="noopener">まちがい・直したいところを送る</a>
          </div>
        </div>
      </div>
    </section>

    <dialog class="term-dialog" id="termDialog">
      <div class="dialog-body">
        <button class="close-button" id="closeDialog" type="button" aria-label="閉じる">×</button>
        <div id="dialogContent"></div>
      </div>
    </dialog>

    <footer class="site-footer">
      <div class="inner">
        <p>社会ことば辞典 <span data-edition-label>第3版</span></p>
        <p>© School Stock</p>
      </div>
    </footer>

    <script src="data/terms.js?v=3"></script>
    <script src="data/zukai/zukai_g3.js?v=3"></script>
    <script src="data/zukai/zukai_g4.js?v=3"></script>
    <script src="data/zukai/zukai_g5.js?v=3"></script>
    <script src="data/zukai/zukai_g6.js?v=3"></script>
    <script src="assets/app.js?v=3"></script>
  </body>
</html>
